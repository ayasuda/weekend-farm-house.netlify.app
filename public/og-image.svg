<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#354d2f"/>
  <!-- Decorative background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6741"/>
      <stop offset="100%" stop-color="#2a3d28"/>
    </linearGradient>
  </defs>

  <!-- Ground strip -->
  <rect x="0" y="460" width="1200" height="170" fill="#3a5530" opacity="0.5"/>

  <!-- House silhouette -->
  <polygon points="600,220 760,340 440,340" fill="#f5ede0" opacity="0.15"/>
  <rect x="460" y="340" width="280" height="150" fill="#f5ede0" opacity="0.12"/>

  <!-- Main text -->
  <text x="600" y="200" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="52" font-weight="400" fill="#f5ede0" opacity="0.95">小さな農園付き分譲地、</text>
  <text x="600" y="272" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="52" font-weight="400" fill="#f5ede0" opacity="0.95">あなたの週末セカンドハウス。</text>

  <!-- Sub copy -->
  <text x="600" y="350" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" font-size="26" fill="#c8e8b0" opacity="0.85">都内で暮らしながら、週末だけ土に触れる。</text>

  <!-- Disclaimer -->
  <rect x="300" y="420" width="600" height="44" rx="22" fill="#ffffff" opacity="0.1"/>
  <text x="600" y="448" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" fill="#f5ede0" opacity="0.7">構想段階のコンセプトサイトです</text>

  <!-- Bottom site label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#c8a96e" opacity="0.8">weekend-farm-house.netlify.app</text>

  <!-- Decorative dots/leaves -->
  <circle cx="120" cy="100" r="60" fill="#6a9455" opacity="0.15"/>
  <circle cx="1080" cy="120" r="70" fill="#6a9455" opacity="0.12"/>
  <circle cx="180" cy="530" r="40" fill="#c8a96e" opacity="0.1"/>
  <circle cx="1020" cy="520" r="50" fill="#c8a96e" opacity="0.1"/>
</svg>
